apiVersion: apps/v1
kind: Deployment
metadata:
  name: spam-classifier-deployment
  labels:
    app: spam-classifier
spec:
  replicas: 2
  selector:
    matchLabels:
      app: spam-classifier
  template:
    metadata:
      labels:
        app: spam-classifier
    spec:
      containers:
        - name: spam-classifier
          image: spam-classifier:multistage
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
