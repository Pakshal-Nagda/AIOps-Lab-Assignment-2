apiVersion: batch/v1
kind: Job

metadata:
  name: signup-validator

spec:
  completions: 8
  parallelism: 4
  completionMode: Indexed

  template:
    metadata:
      labels:
        app: signup-validator

    spec:
      restartPolicy: Never

      containers:
        - name: validator
          image: signup-validator:latest
          imagePullPolicy: IfNotPresent

          env:
            - name: JOB_COMPLETION_INDEX
              valueFrom:
                fieldRef:
                  fieldPath: metadata.annotations['batch.kubernetes.io/job-completion-index']

            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName

            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name

          args:
            - "$(JOB_COMPLETION_INDEX)"

          resources:
            requests:
              cpu: "1"
            limits:
              cpu: "1"
